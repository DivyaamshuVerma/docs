<body>
  <div class="wrapper">
    <form [formGroup]="loginForm" (ngSubmit)="loginUser()">
      <h2>Login</h2>
        <div class="input-field">
        <input type="text" formControlName="email" required>
        <label>Enter your email</label>
        <div class="error-msg" *ngIf="loginForm.get('email').invalid && loginForm.get('email').touched">*email is required</div>
      </div>
      <div class="input-field">
        <input type="password" formControlName="password" required>
        <label>Enter your password</label>
        <div class="error-msg" *ngIf="loginForm.get('password').invalid && loginForm.get('password').touched">*password is required</div>
      </div>
      <div class="forget">
        <label for="remember">
          <input type="checkbox" id="remember">
          <p>Remember me</p>
        </label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit">Log In</button>
      <div class="register">
        <p>Don't have an account? <a href="#">Register</a></p>
      </div>
    </form>
  </div>
</body>
