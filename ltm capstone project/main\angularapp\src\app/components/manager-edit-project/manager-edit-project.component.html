 <form [formGroup]="projectForm" (ngSubmit)="editProject()" class="form-container">
  <h1>Edit Project</h1>
  
  <div class="form-group">
    <label for="title">Project Title</label>
    <input type="text" id="title" formControlName="projectTitle" required>
  </div>
  
  <div class="form-group">
    <label for="description">Project Description</label>
    <textarea id="description" formControlName="projectDescription" required></textarea>
  </div>
  
  <div class="form-group">
    <label for="startDate">Start Date</label>
    <input type="date" id="startDate" formControlName="startDate" required>
  </div>
  
  <div class="form-group">
    <label for="endDate">End Date</label>
    <input type="date" id="endDate" formControlName="endDate" required>
  </div>
  
  <div class="form-group">
    <label for="frontEnd">Front End Tech Stack</label>
    <input type="text" id="frontEnd" formControlName="frontEndTechStack" required>
  </div>
  
  <div class="form-group">
    <label for="backEnd">Back End Tech Stack</label>
    <input type="text" id="backEnd" formControlName="backendTechStack" required>
  </div>
  
  <div class="form-group">
    <label for="database">Database</label>
    <input type="text" id="database" formControlName="databaseStack" required>
  </div>
  
  <!-- <div class="form-group">
    <label for="status">Status</label>
    <input type="text" id="status" formControlName="status" required>
  </div>
   -->
  <button type="submit" [disabled]="projectForm.invalid" class="btn submit-btn">Submit</button>
</form>
