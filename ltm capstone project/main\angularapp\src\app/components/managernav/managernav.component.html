<div class="navbar">
    <div class="heading">
        <img src="../../../assets/protech-suite-high-resolution-logo-transparent (1).png" alt="logo"/><span>ProTech</span>
    </div>
    <div class="links">
        <span>Manager/{{username}}</span>
        <a routerLink="/home">Home</a>
        
        <div class="dropdown" id="Project">Project
            <div class="child">
                <a routerLink="/maddproject">Add Project</a>
                <a routerLink="/mviewproject">View Project</a>
            </div> 
        </div>

        <div class="dropdown" id="projectproposal">Proposal
            <div class="child">
                <a routerLink="/mviewproposal">View Proposal</a>
            </div>
        </div>
        
        <div class="dropdown" id="Feedback">Feedback
            <div class="child">
                <a routerLink="/mviewfeedback">View Feedback</a>
            </div>
        </div>
        
        <a (click)="logout()" routerLink="/login">Logout</a>
    </div>  
</div>
